name: Coleta Mensal de Dados

on:
  schedule:
    # Dia 21 de cada mês, 09:00 (horário de Brasília = UTC-3)
    - cron: "0 12 21 * *"
  workflow_dispatch: {}

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: BACKEND/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline completo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
        run: python executar_pipeline.py
